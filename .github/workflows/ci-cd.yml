name: CI/CD Pipeline

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: write
  pull-requests: read

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Testes Unitários e de Integração (Fail-Fast)
  # ─────────────────────────────────────────────
  test:
    name: Test Suite (Unit & Integration)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes unitários
        run: npm run test:unit

      - name: Executar testes de integração
        run: npm run test:integration

  # ─────────────────────────────────────────────
  # Job 2: Criação de Tag & Release Notes no Merge
  # ─────────────────────────────────────────────
  tag:
    name: Create Git Tag & Release
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    outputs:
      new_tag: ${{ steps.bump_tag.outputs.new_tag }}
      date_tag: ${{ steps.bump_tag.outputs.date_tag }}

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular versão da Tag e Hash de Data
        id: bump_tag
        run: |
          # 1. Obter hash de data no formato YYYYmmDD
          DATE_TAG=$(date +'%Y%m%d')
          echo "date_tag=$DATE_TAG" >> "$GITHUB_OUTPUT"

          # 2. Obter versão base definida no package.json
          PKG_VERSION=$(node -p "require('./package.json').version")
          
          # 3. Buscar todas as tags do repositório remoto
          git fetch --tags --force
          
          # 4. Verificar última tag no formato v*.*.*
          LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1)
          
          if [ -z "$LATEST_TAG" ]; then
            NEW_TAG="v${PKG_VERSION}"
          else
            if ! git rev-parse "v${PKG_VERSION}" >/dev/null 2>&1; then
              NEW_TAG="v${PKG_VERSION}"
            else
              VERSION_WITHOUT_V="${LATEST_TAG#v}"
              IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_WITHOUT_V"
              NEW_PATCH=$((PATCH + 1))
              NEW_TAG="v${MAJOR}.${MINOR}.${NEW_PATCH}"
            fi
          fi
          
          echo "Nova tag calculada: $NEW_TAG"
          echo "Hash de data (YYYYmmDD): $DATE_TAG"
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

          # 5. Configurar git bot e criar tag anotada
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEW_TAG" -m "Release $NEW_TAG - Build $DATE_TAG"
          git push origin "$NEW_TAG"

          # 6. Criar Release no GitHub com release notes automáticas prontas para edição
          gh release create "$NEW_TAG" \
            --title "Release $NEW_TAG ($DATE_TAG)" \
            --generate-notes || echo "Release já criada ou aviso ignorado."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────
  # Job 3: Build & Push da imagem Docker com múltiplos versionamentos
  # ─────────────────────────────────────────────
  publish:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [test, tag]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar QEMU
        uses: docker/setup-qemu-action@v3

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Construir e enviar imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/support-agent:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/support-agent:${{ needs.tag.outputs.new_tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/support-agent:${{ needs.tag.outputs.date_tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/support-agent:${{ needs.tag.outputs.new_tag }}-${{ needs.tag.outputs.date_tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/support-agent:${{ github.sha }}
